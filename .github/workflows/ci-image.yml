# Builds the Linux CI job's environment (tools/linux/ci.Containerfile) and pushes it to GitHub Packages (ghcr.io),
# free for public repositories. Only the build tools go in it: no game files, no build of the app.
name: CI image
on:
  push:
    branches: ['main']
    paths: ['tools/linux/ci.Containerfile', '.github/workflows/ci-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and push ghcr.io/${{ github.repository_owner }}/skywardrecomp-ci
        run: |
          img=ghcr.io/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/skywardrecomp-ci
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f tools/linux/ci.Containerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$img:latest" -t "$img:${{ github.sha }}" .
          docker push "$img:latest"
          docker push "$img:${{ github.sha }}"
