# SkywardRecomp's Windows release: builds the Windows x64 zip (make dist: SkywardRecomp-<version>-windows.zip) and
# PUBLISHES it on a GitHub release, so players (and launchers that read the latest release) can download it. The zip
# holds no game code or game files (the start screen builds the game code from the player's own game files); the
# build checks that before the upload.
#
# Three ways to start it (the tag must equal LARECOMP_VERSION in runtime/ui/launcher.mm at the built commit: the
# file names come from it):
#   - publish a release on GitHub (Releases -> Draft a new release, tag = LARECOMP_VERSION): the zip and its sha256
#     are added to it (a release that already has a -windows.zip is left alone);
#   - push a tag v* / beta_*: a release for it is made and published with the zip;
#   - Actions -> Release (Windows) -> Run workflow, tag (+ ref: branch or commit, default: the chosen branch's head).
# Tags test-* / ci-test-* make a prerelease (ci-test-*: may differ from LARECOMP_VERSION, a dry run of this file).
# The full four-platform build (macOS needs the self-hosted VM) stays in release.yml, by hand.
name: Release (Windows)
on:
  release:
    types: [published]
  push:
    tags: ['v*', 'beta_*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (= LARECOMP_VERSION at ref; ci-test-*: dry run)'
        required: true
      ref:
        description: 'Branch or commit to build (default: the chosen branch head)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:  # (one run per tag at a time)
  group: release-windows-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # (the inputs go through env, never into the script text)
      - name: Tag = LARECOMP_VERSION
        id: v
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          EVENT: ${{ github.event_name }}
          ASSETS: ${{ github.event_name == 'release' && toJSON(github.event.release.assets) || '[]' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = release ] && jq -e 'any(.[]; .name | endswith("-windows.zip"))' <<< "$ASSETS" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$TAG already has a Windows zip"; exit 0
          fi
          [[ $TAG =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::tag '$TAG': letters, digits, . _ - only"; exit 1; }
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/^#define LARECOMP_VERSION "\(.*\)"/\1/p' runtime/ui/launcher.mm)
          if [ "$VERSION" != "$TAG" ]; then
            if [[ $TAG == ci-test-* ]]; then
              echo "::warning::dry run: tag $TAG, LARECOMP_VERSION $VERSION (the zip is named after $VERSION)"
            else
              echo "::error::LARECOMP_VERSION at $SHA is '$VERSION', not '$TAG': set it in runtime/ui/launcher.mm first"
              exit 1
            fi
          fi
          # an existing tag must already point at this commit
          if TAGGED=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" -q .sha 2>/dev/null); then
            [ "$TAGGED" = "$SHA" ] || { echo "::error::tag $TAG exists at $TAGGED, not at $SHA"; exit 1; }
          fi
          { echo "sha=$SHA"; echo "version=$VERSION"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          echo "$TAG: $SHA, LARECOMP_VERSION $VERSION"

  windows:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings, as tools/setup_windows.ps1 sets for clones
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # the generator helpers are frozen from a python.org-style CPython 3.12 (MSYS2's Python has no oead wheel)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      # MSYS2 UCRT64 as tools/setup_windows.ps1 sets it up (minus the debugger / validation layers; no FFmpeg:
      # the release links make deps-windows' LGPL one), nasm for FFmpeg's VP9 assembly, zip / unzip for the
      # release zip and the compiler download
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p binutils:p sdl3:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p nasm:p
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-${{ runner.os }}-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg)
        run: make deps-windows
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      # the game code generator and the .nsp extractor (the start screen's setup); the inherited Link's Awakening
      # seed generator (make rando-helper) isn't built: its randomizer sources aren't in this repository
      - name: Generator helpers
        run: |
          PY=$(cygpath -u '${{ steps.py.outputs.python-path }}')
          make gen-helper RANDO_PY="$PY" && make extract-helper RANDO_PY="$PY"
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      # (make dist: the exe holds no game code, no GPL codec libraries)
      - name: Release zip
        run: make -j"$(nproc)" dist
      - name: No game files or generated C
        run: |
          D="build/dist/SkywardRecomp"
          bad=$(find "$D" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \);
                find "$D" -name '*.c' ! -path '*/zig/lib/*' ! -path '*/gamelib-src/gamelib_entry.c'; find "$D" -name 'skywardgame*')
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*.zip
          if-no-files-found: error
          compression-level: 0  # (already compressed)

  publish:
    needs: [check, windows]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # (only here: the release)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Publish release
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          ls -la
          [ "$(ls *.zip | wc -l)" = 1 ] || { echo "::error::expected one zip"; exit 1; }
          ZIP=$(ls *.zip)
          SUM=$(sha256sum "$ZIP" | cut -d' ' -f1)
          {
            echo "## Download"
            echo
            echo "**Windows x64:** \`$ZIP\`. Unzip it anywhere you can write to and run \`SkywardRecomp/skywardrecomp.exe\`."
            echo
            echo "Needs Windows 10 / 11 x64, a GPU with Vulkan 1.3 and a CPU with AVX2 / FMA."
            echo
            echo "You need your own legally obtained copy of *The Legend of Zelda: Skyward Sword HD* (Switch, v1.0.0)."
            echo "This download holds no game code or game files: the start screen builds the game code on your PC from"
            echo "your own files."
            echo
            echo "| File | sha256 |"
            echo "|---|---|"
            echo "| \`$ZIP\` | \`$SUM\` |"
            echo
            echo "Built from $SHA."
          } > ../notes.md
          cat ../notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # (a release that already exists, e.g. published on GitHub: the zip is added, its notes keep theirs on top)
            gh release upload "$TAG" --clobber "$ZIP"
            { gh release view "$TAG" --json body -q .body; echo; echo "---"; echo; cat ../notes.md; } > ../body.md
            gh release edit "$TAG" --notes-file ../body.md
          else
            FLAGS=(--latest); [[ $TAG == test-* || $TAG == ci-test-* ]] && FLAGS=(--prerelease --latest=false)
            gh release create "$TAG" --target "$SHA" --title "SkywardRecomp $TAG" --notes-file ../notes.md "${FLAGS[@]}" "$ZIP"
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets -q '.url, .isDraft, .isPrerelease, (.assets[] | "\(.name) \(.size)")'
